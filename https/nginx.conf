# =====================================================================
# Nginx — บังคับ HTTPS + ความปลอดภัย (ใช้กับ VPS)
# แทนที่ example.ac.th และ path ให้ตรงกับเครื่องของคุณ
#
# ออกใบรับรอง SSL ฟรี (Let's Encrypt) บน Ubuntu:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d example.ac.th -d www.example.ac.th
# certbot จะเติมส่วน ssl_certificate ให้เอง และตั้งต่ออายุอัตโนมัติ
# =====================================================================

# พอร์ต 80: redirect ไป https ทั้งหมด
server {
    listen 80;
    listen [::]:80;
    server_name example.ac.th www.example.ac.th;
    return 301 https://example.ac.th$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.ac.th;

    # ---- certbot จะเพิ่มสองบรรทัดนี้ให้ ----
    ssl_certificate     /etc/letsencrypt/live/example.ac.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ac.th/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/scimath-test;
    index index.html index.php;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # ไม่ให้เปิดไฟล์ที่ไม่ควรเผยแพร่
    location ~* \.(sql|md|log|yml|yaml)$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }

    # ---- เฉพาะเวอร์ชัน PHP: ลบเครื่องหมาย # ออก ----
    # location ~ \.php$ {
    #     include snippets/fastcgi-php.conf;
    #     fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    # }
    # location ^~ /uploads/ { location ~ \.php$ { deny all; } }
}
